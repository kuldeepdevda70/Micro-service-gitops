apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: three-tier
  labels:
    service: web
spec:
  replicas: 1
  selector:
    matchLabels:
      service: web
  template:
    metadata:
      labels:
        service: web
    spec:
      containers:
      - name: web
        image: 267580591980.dkr.ecr.us-west-2.amazonaws.com/web:14043d6cf766f072719f819b52e777171bc09210
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: 200m
            memory: 100Mi
          requests:
            cpu: 100m
            memory: 50Mi
      restartPolicy: Always