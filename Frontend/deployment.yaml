apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: three-tier
  labels:
    service: web
spec:
  replicas: 1
  selector:
    matchLabels:
      service: web
  template:
    metadata:
      labels:
        service: web
    spec:
      containers:
      - name: web
        image: public.ecr.aws/j6x4g5g4/web:65f8c603c88158bbd24d69be583d23e1dd0aa632
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: 200m
            memory: 100Mi
          requests:
            cpu: 100m
            memory: 50Mi
      restartPolicy: Always